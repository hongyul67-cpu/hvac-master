<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공기조화설비 · 수업 슬라이드</title>
<style>
  :root{
    --bg:#070d1c; --panel:#0d1a33; --panel2:#111f3d; --line:#243456;
    --ink:#eaf1ff; --dim:#9db0d6;
    --cyan:#22d3ee; --blue:#3b82f6; --green:#34d399; --amber:#fbbf24;
    --red:#fb7185; --violet:#a78bfa; --pink:#f472b6; --sky:#38bdf8;
  }
  *{box-sizing:border-box}
  /* 버튼은 색·글꼴을 상속하지 않아 기본 검은 글씨가 된다 — 어두운 배경에서 안 보이므로 전역 지정 */
  button{color:var(--ink);font-family:inherit}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(1400px 800px at 50% -10%,#12234a,#070d1c 62%);
    color:var(--ink);font-family:system-ui,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;
    -webkit-tap-highlight-color:transparent;overflow:hidden}

  /* 상단 바 */
  .topbar{position:fixed;top:0;left:0;right:0;height:46px;z-index:30;display:flex;align-items:center;
    gap:8px;padding:0 12px;background:rgba(7,13,26,.82);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .topbar .home{color:var(--dim);text-decoration:none;font-size:12.5px;font-weight:800;
    border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:var(--panel)}
  .topbar .ttl{font-size:13.5px;font-weight:900;letter-spacing:-.2px}
  .topbar .sp{flex:1}
  .chips{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--dim);
    border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:800;cursor:pointer;white-space:nowrap}
  .chip.on{color:#04121f;background:var(--cyan);border-color:var(--cyan)}
  .iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--dim);border-radius:9px;
    width:34px;height:32px;font-size:15px;cursor:pointer}

  /* 진행 바 */
  .pbar{position:fixed;top:46px;left:0;right:0;height:3px;background:#0a1730;z-index:29}
  .pbar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--blue));transition:width .3s}

  /* 슬라이드 무대 */
  .stage{position:fixed;inset:49px 0 62px;display:flex;align-items:center;justify-content:center;padding:14px}
  .slide{display:none;width:100%;max-width:960px;max-height:100%;overflow:auto;
    background:linear-gradient(160deg,var(--panel),#0b1730);border:1px solid var(--line);
    border-radius:20px;padding:24px 26px 28px}
  .slide.on{display:block;animation:sin .3s ease}
  @keyframes sin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .slide::-webkit-scrollbar{width:8px}
  .slide::-webkit-scrollbar-thumb{background:#22345a;border-radius:8px}

  .utag{display:inline-block;font-size:12px;font-weight:900;color:#04121f;border-radius:999px;
    padding:3px 11px;margin-bottom:10px}
  .stitle{font-size:26px;font-weight:900;letter-spacing:-.5px;line-height:1.25;margin:0 0 4px}
  .ssub{color:var(--dim);font-size:14.5px;line-height:1.6;margin:0 0 16px}
  .lead{font-size:16px;line-height:1.7}
  .hl{color:var(--cyan);font-weight:800}
  .hl-a{color:var(--amber);font-weight:800}
  .hl-r{color:var(--red);font-weight:800}
  .hl-g{color:var(--green);font-weight:800}

  /* 정의 박스 */
  .defbox{background:var(--panel2);border-left:4px solid var(--cyan);border-radius:0 12px 12px 0;
    padding:14px 16px;font-size:15.5px;line-height:1.7;margin:12px 0}
  .keyrow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
  .keyrow .k{background:#0e2233;border:1px solid #1c3a4d;border-radius:10px;padding:8px 13px;font-size:14px;font-weight:800}
  .keyrow .k b{color:var(--cyan)}

  /* 표 */
  table.tbl{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px;overflow:hidden;border-radius:12px}
  table.tbl th,table.tbl td{border:1px solid var(--line);padding:9px 11px;text-align:left;line-height:1.5}
  table.tbl th{background:#12233f;font-weight:800;color:#cfe0ff}
  table.tbl td{background:rgba(13,26,51,.5)}
  table.tbl td.c,table.tbl th.c{text-align:center}
  table.tbl .yes{color:var(--green);font-weight:900}
  table.tbl .no{color:var(--red);font-weight:900}
  table.tbl .tri{color:var(--amber);font-weight:900}
  .tblcap{font-size:12px;color:var(--dim);margin-top:-4px}

  /* 그림 프레임 */
  .fig{background:#081226;border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0}
  .fig svg{display:block;width:100%;height:auto}
  .figcap{text-align:center;font-size:12.5px;color:var(--dim);margin-top:8px}
  .figimg{background:#f7fafc;border-radius:10px;padding:10px;text-align:center;margin:0}
  .figimg img{max-width:100%;max-height:300px;height:auto;border-radius:4px}
  .imgrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
  .imgrow .figcap{margin-top:6px}
  @media(max-width:640px){.imgrow{grid-template-columns:1fr}}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:640px){.grid2{grid-template-columns:1fr}.stitle{font-size:22px}.slide{padding:18px 16px 22px}}

  /* SVG 공통 텍스트 */
  svg text{font-family:inherit}
  /* 색을 깜빡한 SVG 글자는 기본이 '검정' — 어두운 배경에서 안 보이므로 밝은 기본색을 준다.
     (class나 fill을 직접 지정한 글자는 그대로 유지) */
  svg text:not([class]):not([fill]){fill:var(--ink)}
  /* fill을 직접 지정한 글자(색으로 뜻을 구분하는 라벨)는 그 색을 살린다.
     CSS 규칙은 presentation attribute를 이기므로 :not([fill])로 비켜준다. */
  .s-lab{font-weight:800}
  .s-lab:not([fill]){fill:var(--ink)}
  .s-dim:not([fill]){fill:var(--dim)}
  .s-cap{font-size:11px}
  .s-cap:not([fill]){fill:var(--dim)}

  /* 하단 내비게이션 */
  .nav{position:fixed;bottom:0;left:0;right:0;height:58px;z-index:30;display:flex;align-items:center;
    gap:10px;padding:0 14px;background:rgba(7,13,26,.86);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
  .nav button.mv{flex:1;max-width:200px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
    border-radius:12px;padding:12px;font-size:14px;font-weight:900;font-family:inherit;cursor:pointer}
  .nav button.mv:active{transform:translateY(1px)}
  .nav button.mv:disabled{opacity:.4}
  .nav .count{flex:1;text-align:center;font-size:13px;color:var(--dim);font-weight:800}
  .cover{text-align:center;padding:30px 10px}
  .cover .big{font-size:64px}
  .cover h1{font-size:32px;font-weight:900;margin:10px 0 6px}
  .cover p{color:var(--dim);font-size:15px;line-height:1.7;margin:0}
  .cover .uwrap{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
  .cover .ucard{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 13px;font-size:13px;font-weight:700}
  .tip{margin-top:14px;font-size:13.5px;color:var(--amber);font-weight:700}
  .cta{display:inline-block;margin:6px 6px 0;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:900;
    text-decoration:none;color:#fff;background:linear-gradient(135deg,#0ea5e9,#2563eb)}
  .cta.g{background:var(--panel);border:1px solid var(--line);color:var(--ink)}
  ul.clean{margin:10px 0;padding-left:20px;line-height:1.8;font-size:15px}
  ul.clean li{margin-bottom:4px}

  /* ── 빈칸 (수업 중 함께 채우기) ── */
  .bl{position:relative;display:inline-block;min-width:2.4em;color:transparent!important;
    border-bottom:3px solid var(--amber);background:rgba(251,191,36,.12);
    border-radius:5px 5px 0 0;padding:0 .25em;margin:0 .05em;cursor:pointer;
    font-weight:800;transition:.16s}
  .bl::before{content:"?";position:absolute;left:0;right:0;text-align:center;
    color:var(--amber);opacity:.75;font-weight:900}
  .bl:hover{background:rgba(251,191,36,.26)}
  .bl.next{box-shadow:0 0 0 3px rgba(251,191,36,.45);animation:blpulse 1.6s infinite}
  @keyframes blpulse{0%,100%{box-shadow:0 0 0 3px rgba(251,191,36,.45)}50%{box-shadow:0 0 0 7px rgba(251,191,36,.10)}}
  /* 열린 빈칸 — 원래 글자색은 그대로, 초록 밑줄로 '방금 열림' 표시 */
  .op{background:rgba(52,211,153,.18);border-bottom:3px solid var(--green);
    border-radius:5px 5px 0 0;padding:0 .25em;animation:blpop .32s cubic-bezier(.34,1.56,.64,1)}
  @keyframes blpop{0%{transform:scale(.72)}100%{transform:scale(1)}}

  /* ── 발문 (선생님 질문) ── */
  .askbox{display:none;margin-top:16px;background:#1b1509;border:1px solid #6b5417;
    border-left:5px solid var(--amber);border-radius:0 14px 14px 0;padding:14px 16px}
  body.showask .askbox{display:block;animation:sin .28s ease}
  .askbox .ah{font-size:12px;font-weight:900;color:var(--amber);letter-spacing:.5px;margin-bottom:8px}
  .askbox ul{margin:0;padding-left:20px}
  .askbox li{font-size:15px;line-height:1.65;color:#f8ecc6;font-weight:700;margin-bottom:7px}
  .askbox li:last-child{margin-bottom:0}

  /* 토글 버튼 활성 상태 · 빈칸 진행 표시 */
  .iconbtn.act{background:var(--amber);border-color:var(--amber);color:#241a02}
  .navbl{flex:none;border:1px solid var(--amber);background:rgba(251,191,36,.14);color:var(--amber);
    border-radius:12px;padding:11px 14px;font-size:13.5px;font-weight:900;font-family:inherit;cursor:pointer}
  .navbl:disabled{opacity:.4}
</style>
</head>
<body>
<div class="topbar">
  <a class="home" href="index.html">← 허브</a>
  <span class="ttl">🌬️ 수업 슬라이드</span>
  <span class="sp"></span>
  <div class="chips" id="chips"></div>
  <button class="iconbtn" id="clozeBtn" title="빈칸 모드 (B)">␣</button>
  <button class="iconbtn" id="askBtn" title="발문 보기 (Q)">💬</button>
  <button class="iconbtn" id="fs" title="전체화면">⛶</button>
</div>
<div class="pbar"><i id="pbar"></i></div>

<div class="stage" id="stage"><!-- 슬라이드 주입 --></div>

<div class="nav">
  <button class="mv" id="prev">← 이전</button>
  <span class="count" id="count"></span>
  <button class="navbl hide" id="revealBtn">빈칸 열기</button>
  <button class="mv" id="next">다음 →</button>
</div>

  <rect x="175" y="20" width="16" height="130" rx="8" fill="#0e1f3d" stroke="#22d3ee" stroke-width="2"/>
  <circle cx="183" cy="165" r="18" fill="#22d3ee"/><rect x="179" y="90" width="8" height="70" fill="#22d3ee"/>
  <path d="M168 150 q-10 10 0 20 q20 8 30 0 q10 -10 0 -20" fill="rgba(34,211,238,.25)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="183" y="200" text-anchor="middle" class="s-lab" font-size="13">습구온도</text>
  <text x="128" y="120" text-anchor="middle" class="s-dim" font-size="11">젖은 거즈</text>
</svg><div class="figcap">습구는 증발 때문에 건구보다 낮다</div></div>
<div>
<table class="tbl">
<tr><th>온도</th><th>뜻</th></tr>
<tr><td><b>건구온도</b></td><td>보통 온도계로 잰 공기 온도</td></tr>
<tr><td><b>습구온도</b></td><td>젖은 거즈로 감싼 온도계 값 (증발로 <span class="hl">더 낮음</span>)</td></tr>
<tr><td><b>노점온도</b></td><td>냉각 시 <span class="hl">이슬</span>이 맺히기 시작하는 온도</td></tr>
</table>
<div class="defbox">건구·습구 차이가 크면 <span class="hl-a">건조</span>, 차이가 작으면 <span class="hl">습함</span>.</div>
</div></div>`},

{u:1,t:"습도와 습공기선도",html:
`<div class="ssub">습도는 두 가지로 나타내고, 상태값은 습공기선도에서 읽습니다.</div>
<table class="tbl">
<tr><th style="width:26%">습도</th><th>뜻</th></tr>
<tr><td><b>절대습도</b></td><td>건공기 1kg에 든 수증기의 <span class="hl">질량</span> (kg/kg′) — '양'</td></tr>
<tr><td><b>상대습도(RH)</b></td><td>포화 대비 현재 수증기 <span class="hl">비율</span>(%) — 우리가 아는 '습도 %'</td></tr>
</table>
<div class="fig"><svg viewBox="0 0 620 210">
  <line x1="60" y1="180" x2="590" y2="180" stroke="#2f4a80" stroke-width="1.5"/>
  <line x1="60" y1="180" x2="60" y2="25" stroke="#2f4a80" stroke-width="1.5"/>
  <text x="590" y="200" text-anchor="end" class="s-cap">건구온도 →</text>
  <text x="52" y="26" text-anchor="end" class="s-cap">절대습도 ↑</text>
  <path d="M60 178 Q 300 175 430 120 Q 520 78 560 40" fill="none" stroke="#34d399" stroke-width="3"/>
  <text x="470" y="70" class="s-lab" font-size="12" fill="#34d399">상대습도 100%(포화)</text>
  <path d="M60 178 Q 320 176 470 140" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="360" y="168" class="s-dim" font-size="11">RH 50%</text>
  <circle cx="300" cy="163" r="5" fill="#fbbf24"/><text x="300" y="150" text-anchor="middle" class="s-lab" font-size="11" fill="#fbbf24">상태점</text>
</svg><div class="figcap">습공기선도 — 온도·습도·엔탈피의 관계를 한 장으로</div></div>
<div class="keyrow"><span class="k"><b>엔탈피</b> = 현열 + 잠열, 공기의 총 열량</span></div>`},

{u:1,t:"실내 공기질 — 왜 환기가 필요한가",html:
`<div class="lead">사람이 모인 방은 <span class="hl-r">CO₂</span>가 쌓입니다. 공조에서 <span class="hl">청정도</span>를 다루는 이유입니다.</div>
<div class="fig"><svg viewBox="0 0 620 150">
  <text x="20" y="24" class="s-cap">실내 CO₂ 농도(ppm)</text>
  <rect x="20" y="36" width="140" height="34" rx="6" fill="#0b2019" stroke="#34d399" stroke-width="2"/>
  <text x="90" y="58" text-anchor="middle" class="s-lab" font-size="13" fill="#34d399">~700 쾌적</text>
  <rect x="170" y="36" width="150" height="34" rx="6" fill="#3a2f10" stroke="#fbbf24" stroke-width="2"/>
  <text x="245" y="58" text-anchor="middle" class="s-lab" font-size="13" fill="#fbbf24">1000 기준치</text>
  <rect x="330" y="36" width="140" height="34" rx="6" fill="#2c1220" stroke="#fb7185" stroke-width="2"/>
  <text x="400" y="58" text-anchor="middle" class="s-lab" font-size="13" fill="#fb7185">2000 졸림·두통</text>
  <rect x="480" y="36" width="120" height="34" rx="6" fill="#2c1220" stroke="#fb7185" stroke-width="2"/>
  <text x="540" y="58" text-anchor="middle" class="s-lab" font-size="13" fill="#fb7185">3000↑ 위험</text>
  <text x="20" y="100" class="s-cap">사람이 들어오면 ↑</text>
  <path d="M150 95 L300 95" stroke="#fb7185" stroke-width="3" marker-end="url(#aq1)"/>
  <text x="330" y="100" class="s-lab" font-size="12" fill="#34d399">환기하면 ↓</text>
  <path d="M470 95 L590 95" stroke="#34d399" stroke-width="3" marker-end="url(#aq1)"/>
  <text x="20" y="135" class="s-dim" font-size="12">교실 30명 × 25 m³/h = 필요 환기량 약 750 m³/h</text>
  <defs><marker id="aq1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9db0d6"/></marker></defs>
</svg><div class="figcap">사람 수가 늘수록 CO₂는 오르고, 환기하면 내려간다</div></div>
<table class="tbl">
<tr><th>오염 요소</th><th>주된 원인</th><th>대책</th></tr>
<tr><td>CO₂</td><td>{{사람의 호흡}}</td><td>{{환기량 확보}}</td></tr>
<tr><td>미세먼지</td><td>외기 유입·실내 활동</td><td>{{공기여과기(필터)}}</td></tr>
<tr><td>냄새·유해가스</td><td>건축자재·조리</td><td>국소배기·환기</td></tr>
</table>`},

/* ═══════════ 단원 2 · 부하 ═══════════ */
{u:2,t:"열부하란?",html:
`<div class="lead">적정 온·습도를 지키려고 <span class="hl">공급하거나 제거해야 하는 열량</span>이 열부하(공기조화부하)입니다.</div>
<div class="fig"><svg viewBox="0 0 620 200">
  <rect x="40" y="45" width="220" height="110" rx="12" fill="#0e2233" stroke="#38bdf8" stroke-width="2"/>
  <text x="150" y="35" text-anchor="middle" class="s-cap">여름 · 냉방</text>
  <text x="150" y="100" text-anchor="middle" font-size="30">🥵→😎</text>
  <path d="M150 150 L150 185" stroke="#38bdf8" stroke-width="3" marker-end="url(#arb)"/>
  <text x="150" y="182" text-anchor="middle" class="s-lab" font-size="13" fill="#38bdf8">열 빼기</text>
  <rect x="360" y="45" width="220" height="110" rx="12" fill="#2c1220" stroke="#fb7185" stroke-width="2"/>
  <text x="470" y="35" text-anchor="middle" class="s-cap">겨울 · 난방</text>
  <text x="470" y="100" text-anchor="middle" font-size="30">🥶→😊</text>
  <path d="M470 185 L470 150" stroke="#fb7185" stroke-width="3" marker-end="url(#arb)"/>
  <text x="470" y="182" text-anchor="middle" class="s-lab" font-size="13" fill="#fb7185">열 더하기</text>
  <defs><marker id="arb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8aa"/></marker></defs>
</svg></div>
<div class="keyrow"><span class="k"><b style="color:#38bdf8">냉방부하</b> = 제거할 현열+잠열</span><span class="k"><b style="color:#fb7185">난방부하</b> = 보충할 현열+잠열</span></div>`},

{u:2,t:"부하의 구성요소",html:
`<div class="ssub">실내로 들어오고 나가는 열의 통로를 알아야 부하를 계산합니다.</div>
<div class="fig"><svg viewBox="0 0 620 240">
  <rect x="170" y="60" width="280" height="150" rx="8" fill="#0e1f3d" stroke="#2f4a80" stroke-width="2"/>
  <text x="310" y="145" text-anchor="middle" class="s-lab" font-size="15">실내</text>
  <line x1="310" y1="60" x2="310" y2="30" stroke="#fbbf24" stroke-width="2"/><text x="310" y="24" text-anchor="middle" class="s-cap">지붕</text>
  <!-- 일사 -->
  <text x="120" y="55" font-size="20">☀️</text><path d="M140 62 L215 100" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arf)"/><text x="120" y="90" class="s-lab" font-size="11" fill="#fbbf24">일사</text>
  <!-- 외벽 관류 -->
  <path d="M150 150 L165 150" stroke="#fb7185" stroke-width="3" marker-end="url(#arf)"/><text x="90" y="154" class="s-lab" font-size="11" fill="#fb7185">외벽 관류</text>
  <!-- 틈새바람 -->
  <path d="M150 185 L165 175" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arf)"/><text x="80" y="192" class="s-lab" font-size="11" fill="#38bdf8">틈새바람</text>
  <!-- 내부발열 -->
  <text x="250" y="115" font-size="18">👤</text><text x="300" y="115" font-size="18">💡</text><text x="350" y="115" font-size="18">🖥️</text>
  <text x="310" y="185" text-anchor="middle" class="s-dim" font-size="11">사람·조명·기기 (내부발열)</text>
  <!-- 외기 -->
  <path d="M470 130 L520 130" stroke="#34d399" stroke-width="2.5" marker-start="url(#arf2)"/><text x="540" y="134" class="s-lab" font-size="11" fill="#34d399">외기</text>
  <defs>
    <marker id="arf" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9db0d6"/></marker>
    <marker id="arf2" markerWidth="9" markerHeight="9" refX="1" refY="3" orient="auto"><path d="M7,0 L0,3 L7,6 Z" fill="#34d399"/></marker>
  </defs>
</svg><div class="figcap">건물 단면으로 본 부하의 통로</div></div>
<div class="keyrow"><span class="k"><b>실내부하</b> 외벽·유리·틈새·{{사람·기기}}</span><span class="k"><b>장치부하</b> {{송풍기·덕트}}</span><span class="k">{{외기부하}}·{{재열부하}}</span></div>`},

{u:2,t:"냉방·난방 부하 계산 포함 여부",html:
`<div class="ssub">같은 요소라도 냉방이냐 난방이냐에 따라 계산에 넣는지가 다릅니다.</div>
<table class="tbl">
<tr><th>요소</th><th class="c">냉방부하</th><th class="c">난방부하</th></tr>
<tr><td>외벽·지붕·유리(전도)</td><td class="c yes">O</td><td class="c yes">O</td></tr>
<tr><td>유리창 일사</td><td class="c yes">O</td><td class="c tri">△</td></tr>
<tr><td>틈새바람 (현열+잠열)</td><td class="c yes">O</td><td class="c yes">O</td></tr>
<tr><td>사람·조명·기기 (내부발열)</td><td class="c yes">O</td><td class="c no">무시</td></tr>
<tr><td>송풍기·덕트 (장치부하)</td><td class="c yes">O</td><td class="c no">무시</td></tr>
<tr><td>외기부하</td><td class="c yes">O</td><td class="c yes">O</td></tr>
</table>
<div class="tblcap">O 포함 · △ 클 때만 고려 · '무시' 계산에서 제외</div>
<div class="defbox">핵심 — 내부발열·장치부하는 <span class="hl">냉방에서만</span> 넣는다(난방엔 오히려 도움이라 무시).</div>`},

{u:2,t:"부하 계산의 기초식",html:
`<div class="grid2">
<div>
  <div class="defbox" style="border-color:#fb7185"><b class="hl-r">현열</b> 계산<br>
    <span style="font-size:19px;font-weight:900">Qs = m · cp · (t₂ − t₁)</span><br>
    <span class="s-dim" style="font-size:12.5px">질량유량 × 비열 × 온도차</span></div>
  <div class="defbox" style="border-color:#38bdf8"><b class="hl">잠열</b> 계산<br>
    <span style="font-size:19px;font-weight:900">QL = L · m · (χ₂ − χ₁)</span><br>
    <span class="s-dim" style="font-size:12.5px">증발잠열 × 유량 × 절대습도차</span></div>
</div>
<div>
<table class="tbl">
<tr><th colspan="2">환기량 기준</th></tr>
<tr><td>목표</td><td>실내 CO₂ <span class="hl">0.1% 이하</span></td></tr>
<tr><td>1인당</td><td><span class="hl-g">25~30 m³/h</span></td></tr>
<tr><td>사무실</td><td>약 7.2 m³/(h·m²)</td></tr>
<tr><td>영화관</td><td>약 50 m³/(h·m²)</td></tr>
</table>
<div class="keyrow"><span class="k"><b>TAC 온도</b>: 위험률(%)로 정한 설계용 외기온도</span></div>
</div></div>`},

{u:2,t:"부하 계산 해보기 — 예제",html:
`<div class="ssub">식에 숫자를 넣어 한 번 풀어 봅시다. (공기 밀도 1.2 kg/m³, 비열 1.0 kJ/kg·K)</div>
<div class="defbox" style="border-color:#fb7185">
<b>문제</b> — 송풍량 <b>1,000 m³/h</b>의 공기를 <b>30℃ → 18℃</b>로 냉각할 때 필요한 현열량은?</div>
<table class="tbl">
<tr><th style="width:16%">단계</th><th>계산</th><th class="c">결과</th></tr>
<tr><td>① 질량유량</td><td>1,000 m³/h × 1.2 kg/m³</td><td class="c">{{1,200 kg/h}}</td></tr>
<tr><td>② 온도차</td><td>30℃ − 18℃</td><td class="c">{{12 ℃}}</td></tr>
<tr><td>③ 현열량</td><td>Qs = 1,200 × 1.0 × 12</td><td class="c">{{14,400 kJ/h}}</td></tr>
<tr><td>④ 환산</td><td>14,400 ÷ 3,600</td><td class="c">{{약 4 kW}}</td></tr>
</table>
<div class="grid2">
<div class="defbox" style="border-color:#34d399"><b>덤 문제</b><br>학생 <b>30명</b> 교실의 필요 환기량은?<br>
30명 × 25 m³/h = <b>{{750 m³/h}}</b></div>
<div class="defbox" style="border-color:#fbbf24"><b>기억할 점</b><br>
현열은 <b>온도차</b>, 잠열은 <b>절대습도차</b>가 핵심.<br>단위(h ↔ s)를 꼭 확인!</div>
</div>`},

/* ═══════════ 단원 3 · 설비 ═══════════ */
{u:3,t:"공기조화설비의 4대 구성",html:
`<div class="lead">공조설비는 <span class="hl">열을 만들고 → 나르고 → 공기를 다듬고 → 자동으로 제어</span>합니다.</div>
<div class="fig"><svg viewBox="0 0 620 180">
  <g font-size="13">
  <rect x="20" y="60" width="120" height="60" rx="10" fill="#2c1220" stroke="#fb7185" stroke-width="2"/><text x="80" y="88" text-anchor="middle" class="s-lab">열원장치</text><text x="80" y="106" text-anchor="middle" class="s-cap">보일러·냉동기</text>
  <rect x="180" y="60" width="120" height="60" rx="10" fill="#0e2233" stroke="#38bdf8" stroke-width="2"/><text x="240" y="88" text-anchor="middle" class="s-lab">열운반장치</text><text x="240" y="106" text-anchor="middle" class="s-cap">덕트·배관·펌프</text>
  <rect x="340" y="60" width="120" height="60" rx="10" fill="#0b2019" stroke="#34d399" stroke-width="2"/><text x="400" y="88" text-anchor="middle" class="s-lab">공기조화기</text><text x="400" y="106" text-anchor="middle" class="s-cap">코일·가습·송풍</text>
  <rect x="500" y="60" width="100" height="60" rx="10" fill="#0e1f3d" stroke="#94a3b8" stroke-width="2"/><text x="550" y="94" text-anchor="middle" class="s-lab">실 (사람)</text>
  <path d="M140 90 L178 90" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#a3)"/>
  <path d="M300 90 L338 90" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#a3)"/>
  <path d="M460 90 L498 90" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#a3)"/>
  <rect x="250" y="145" width="120" height="26" rx="8" fill="#1c1633" stroke="#a78bfa" stroke-width="1.5"/><text x="310" y="163" text-anchor="middle" class="s-lab" font-size="12" fill="#a78bfa">자동제어장치</text>
  <path d="M310 145 L310 122" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 3"/>
  <defs><marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#22d3ee"/></marker></defs>
  </g>
</svg><div class="figcap">열원 → 열운반 → 공기조화기 → 실, 그리고 자동제어</div></div>`},

{u:3,t:"공조 방식의 분류",html:
`<div class="ssub">'무엇으로 열을 실까지 나르는가'로 나눕니다.</div>
<table class="tbl">
<tr><th style="width:24%">방식</th><th>운반 매체</th><th>대표 예</th></tr>
<tr><td><b class="hl">전공기</b></td><td>공기(덕트)</td><td>정풍량(CAV)·변풍량(VAV) 단일덕트, 2중덕트</td></tr>
<tr><td><b class="hl-g">전수</b></td><td>물(냉·온수)</td><td>팬코일유닛(FCU) 2·3·4관식</td></tr>
<tr><td><b>공기-수</b></td><td>공기+물</td><td>유인유닛, 복사냉·난방</td></tr>
<tr><td><b class="hl-a">냉매(개별)</b></td><td>냉매</td><td>룸쿨러, 패키지유닛, 히트펌프</td></tr>
</table>
<div class="defbox">에어컨(룸쿨러)은 <span class="hl-a">냉매 방식(개별식)</span>, 큰 건물 덕트 공조는 보통 <span class="hl">전공기 방식</span>.</div>`},

{u:3,t:"정풍량(CAV) vs 변풍량(VAV)",html:
`<div class="grid2">
<div class="fig"><svg viewBox="0 0 280 170">
  <text x="140" y="20" text-anchor="middle" class="s-lab" font-size="14" fill="#38bdf8">CAV 정풍량</text>
  <rect x="30" y="45" width="70" height="80" rx="8" fill="#0e2233" stroke="#38bdf8" stroke-width="2"/><text x="65" y="90" text-anchor="middle" class="s-cap">공조기</text>
  <path d="M100 85 L220 85" stroke="#38bdf8" stroke-width="10"/><text x="160" y="78" text-anchor="middle" class="s-cap">풍량 일정</text>
  <text x="160" y="112" text-anchor="middle" class="s-lab" font-size="12" fill="#fbbf24">온도를 바꿈</text>

{u:3,t:"덕트와 취출구 — 공기가 나오는 길",html:
`<div class="lead">공조기에서 만든 공기는 <span class="hl">덕트</span>를 타고 와서 <span class="hl-g">취출구</span>로 나오고, <span class="hl-a">흡입구</span>로 되돌아갑니다.</div>

  <path d="M180 98 L180 122" stroke="#38bdf8" stroke-width="3" marker-end="url(#ad1)"/>

  <text x="180" y="140" text-anchor="middle" class="s-lab" font-size="11" fill="#34d399">취출구</text>
  <text x="300" y="140" text-anchor="middle" class="s-lab" font-size="11" fill="#34d399">취출구</text>
  <text x="410" y="140" text-anchor="middle" class="s-lab" font-size="11" fill="#34d399">취출구</text>
  <rect x="470" y="60" width="120" height="60" rx="8" fill="#3a2f10" stroke="#fbbf24" stroke-width="2"/>
  <text x="530" y="88" text-anchor="middle" class="s-lab" font-size="12" fill="#fbbf24">흡입구</text>

</table>
<div class="defbox">취출구 위치가 나쁘면 <span class="hl-r">찬바람이 직접</span> 사람에게 닿아(드래프트) 불쾌해집니다.</div>`},

{u:4,t:"난방 방식",html:
`<table class="tbl">
<tr><th style="width:24%">방식</th><th>내용</th><th>규모</th></tr>
<tr><td>🔥 <b>직접난방</b></td><td>방 안에 스토브·온돌 등 발생기</td><td>소</td></tr>
<tr><td>🏠 <b>개별난방</b></td><td>특정 방만 난방 (가정 보일러)</td><td>소</td></tr>
<tr><td>🏢 <b>중앙난방</b></td><td>지하 보일러 → 여러 방에 공급</td><td>중·대</td></tr>
<tr><td>🌆 <b>지역난방</b></td><td>한 곳에서 도시 구역 여러 건물에 공급</td><td>초대형</td></tr>
<tr><td>♨️ <b>복사난방</b></td><td>바닥·벽에 관을 묻어 복사열 (온돌)</td><td>-</td></tr>
</table>
<div class="defbox">복사난방은 방열량의 <span class="hl">50~70%가 복사</span> — 쾌감도가 가장 우수.</div>`},

{u:4,t:"냉열원 — 냉동사이클 ★",html:
`<div class="lead">냉매가 <span class="hl">압축 → 응축 → 팽창 → 증발</span>을 돌며 열을 실어 나릅니다.</div>
<div class="fig"><svg viewBox="0 0 620 260">
  <defs><marker id="arc" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#22d3ee"/></marker></defs>
  <!-- 4 parts -->
  <rect x="70" y="175" width="130" height="55" rx="10" fill="#2c1220" stroke="#fb7185" stroke-width="2"/><text x="135" y="200" text-anchor="middle" class="s-lab" font-size="14">압축기</text><text x="135" y="219" text-anchor="middle" class="s-cap">저압가스→고압가스</text>
  <rect x="70" y="35" width="130" height="55" rx="10" fill="#2c1220" stroke="#fb7185" stroke-width="2"/><text x="135" y="60" text-anchor="middle" class="s-lab" font-size="14">응축기</text><text x="135" y="79" text-anchor="middle" class="s-cap">열 버림 → 액화</text>
  <rect x="420" y="35" width="130" height="55" rx="10" fill="#0e2233" stroke="#38bdf8" stroke-width="2"/><text x="485" y="60" text-anchor="middle" class="s-lab" font-size="14">팽창밸브</text><text x="485" y="79" text-anchor="middle" class="s-cap">저온·저압으로</text>
  <rect x="420" y="175" width="130" height="55" rx="10" fill="#0e2233" stroke="#38bdf8" stroke-width="2"/><text x="485" y="200" text-anchor="middle" class="s-lab" font-size="14">증발기</text><text x="485" y="219" text-anchor="middle" class="s-cap">열 흡수 → 냉방</text>
  <!-- flow -->
  <path d="M135 175 L135 92" stroke="#fb7185" stroke-width="3.5" marker-end="url(#arc)"/><text x="86" y="135" class="s-lab" font-size="11" fill="#fb7185">고압가스</text>
  <path d="M200 62 L418 62" stroke="#fb7185" stroke-width="3.5" marker-end="url(#arc)"/><text x="310" y="52" text-anchor="middle" class="s-lab" font-size="11" fill="#fb7185">고압액</text>
  <path d="M485 92 L485 173" stroke="#38bdf8" stroke-width="3.5" marker-end="url(#arc)"/><text x="500" y="135" class="s-lab" font-size="11" fill="#38bdf8">저압액</text>
  <path d="M420 202 L202 202" stroke="#38bdf8" stroke-width="3.5" marker-end="url(#arc)"/><text x="310" y="222" text-anchor="middle" class="s-lab" font-size="11" fill="#38bdf8">저압가스</text>
  <text x="310" y="130" text-anchor="middle" class="s-dim" font-size="12">🔴 고압부 (뜨겁다)　🔵 저압부 (차갑다)</text>
</svg><div class="figcap">냉매의 순환 — 빨강=고압, 파랑=저압</div></div>`},

{u:4,t:"냉동사이클 4대 기기의 역할",html:
`<table class="tbl">
<tr><th style="width:22%">기기</th><th>하는 일</th><th class="c">압력</th></tr>
<tr><td>🔴 <b>압축기</b></td><td>저온·저압 가스를 <span class="hl-r">고온·고압</span>으로 압축 (사이클의 심장)</td><td class="c">↑</td></tr>
<tr><td>🔴 <b>응축기</b></td><td>열을 버려 가스를 <span class="hl">액체</span>로 응축</td><td class="c">고압</td></tr>
<tr><td>🔵 <b>팽창밸브</b></td><td>교축시켜 <span class="hl">저온·저압</span>으로 낮춤</td><td class="c">↓</td></tr>
<tr><td>🔵 <b>증발기</b></td><td>증발하며 주위 <span class="hl-g">열을 흡수 = 냉방</span></td><td class="c">저압</td></tr>
</table>
<div class="defbox">실제 <span class="hl-g">냉방 효과</span>는 <span class="hl-g">증발기</span>에서 난다 (열을 빼앗음).</div>`},

/* ══════════════ 엔진 ══════════════ */
var stage=document.getElementById('stage');
var chipsEl=document.getElementById('chips');
var pbar=document.getElementById('pbar');
var countEl=document.getElementById('count');
var prevB=document.getElementById('prev'), nextB=document.getElementById('next');
var cur=0;

var clozeBtn=document.getElementById('clozeBtn');
var askBtn=document.getElementById('askBtn');
var revealBtn=document.getElementById('revealBtn');
var CLOZE=false;                    // 빈칸 모드 on/off

/* 슬라이드 원본 HTML 보관 — 빈칸 모드를 켜고 끌 때마다 다시 그린다 */
var RAW=[];
SLIDES.forEach(function(s,i){
  var color=UCOLOR[s.u]||"#94a3b8";
  var head = s.u===0 ? '' :
    '<span class="utag" style="background:'+color+'">'+s.u+'. '+(UNAME[s.u]||'')+'</span>'
    + '<h2 class="stitle">'+s.t+'</h2>';
  var ask = (ASKS[s.t]||[]);
  var askHtml = ask.length
    ? '<div class="askbox"><div class="ah">💬 함께 생각해 봐요</div><ul>'
      + ask.map(function(q){ return '<li>'+q+'</li>'; }).join('') + '</ul></div>'
    : '';
  RAW[i] = head + s.html + askHtml;
  var sec=document.createElement('section');
  sec.className='slide'; sec.dataset.i=i;
  stage.appendChild(sec);
});
var slideEls=[].slice.call(stage.querySelectorAll('.slide'));

/* 슬라이드 그리기 — 빈칸 모드면 {{답}}과 강조어(.hl 계열)를 빈칸으로 바꾼다 */
function buildSlide(i,force){
  var sec=slideEls[i], html=RAW[i];
  var want = CLOZE?'cloze':'plain';
  // 같은 모드로 이미 그려 뒀으면 그대로 둔다 (열어 놓은 빈칸이 유지되도록)
  if(!force && sec.dataset.mode===want) return;
  sec.dataset.mode=want;
  if(CLOZE){
    html = html.replace(/\{\{([\s\S]+?)\}\}/g, '<span class="bl">$1</span>');
    sec.innerHTML = html;
    // 이미 강조해 둔 핵심어도 빈칸으로 (빈칸 안에 든 것은 제외)
    [].forEach.call(sec.querySelectorAll('.hl,.hl-a,.hl-r,.hl-g'), function(e){
      if(e.closest('.bl')) return;
      e.classList.add('bl');
    });
  } else {
    // 평소에는 {{ }}를 그냥 강조 표시로
    sec.innerHTML = html.replace(/\{\{([\s\S]+?)\}\}/g, '<b class="hl">$1</b>');
  }
  [].forEach.call(sec.querySelectorAll('.bl'), function(b){
    b.onclick=function(){ openBlank(b); };
  });
}
function curSlide(){ return slideEls[cur]; }
function openBlank(b){ b.classList.remove('bl','next'); b.classList.add('op'); paintCloze(); }
function openNextBlank(){ var b=curSlide().querySelector('.bl'); if(b){ openBlank(b); return true; } return false; }
function paintCloze(){
  var s=curSlide(); if(!s) return;
  [].forEach.call(s.querySelectorAll('.bl.next'),function(e){ e.classList.remove('next'); });
  var left=s.querySelectorAll('.bl').length, done=s.querySelectorAll('.op').length;
  if(left) s.querySelector('.bl').classList.add('next');
  if(CLOZE && (left+done)>0){
    revealBtn.classList.remove('hide');
    revealBtn.disabled = (left===0);
    revealBtn.textContent = left ? ('빈칸 열기 '+done+'/'+(left+done)) : ('✔ 다 채웠어요 '+done+'/'+done);
  } else {
    revealBtn.classList.add('hide');
  }
}
/* 빈칸 모드 토글 */
function setCloze(on){
  CLOZE=on;
  clozeBtn.classList.toggle('act',on);
  clozeBtn.title = on? '빈칸 모드 끄기 (B)' : '빈칸 모드 (B)';
  buildSlide(cur); paintCloze();
}
clozeBtn.onclick=function(){ setCloze(!CLOZE); };
revealBtn.onclick=function(){ openNextBlank(); };
/* 발문 토글 */
function setAsk(on){ document.body.classList.toggle('showask',on); askBtn.classList.toggle('act',on); }
askBtn.onclick=function(){ setAsk(!document.body.classList.contains('showask')); };

// 단원 칩 (표지·마무리 제외, 각 단원 첫 슬라이드로 점프)
var unitFirst={};
SLIDES.forEach(function(s,i){ if(s.u>=1 && unitFirst[s.u]===undefined) unitFirst[s.u]=i; });
var chipHtml='<button class="chip" data-go="0">표지</button>';
[1,2,3,4,5,6].forEach(function(u){
  chipHtml+='<button class="chip" data-go="'+unitFirst[u]+'">'+u+'.'+UNAME[u]+'</button>';
});
chipsEl.innerHTML=chipHtml;
[].slice.call(chipsEl.querySelectorAll('.chip')).forEach(function(b){
  b.onclick=function(){ show(+b.dataset.go); };
});

function show(n){
  cur=Math.max(0,Math.min(SLIDES.length-1,n));
  buildSlide(cur);                                   // 현재 슬라이드를 모드에 맞게 그린다
  slideEls.forEach(function(el,i){ el.classList.toggle('on',i===cur); });
  paintCloze();
  var s=SLIDES[cur];
  // 진행바
  pbar.style.width=((cur)/(SLIDES.length-1)*100)+'%';
  countEl.textContent=(cur+1)+' / '+SLIDES.length + (s.u>=1?'　·　'+s.u+'단원':'');
  prevB.disabled=(cur===0); nextB.disabled=(cur===SLIDES.length-1);
  // 칩 활성화 (현재 단원)
  [].slice.call(chipsEl.querySelectorAll('.chip')).forEach(function(b){
    var go=+b.dataset.go;
    b.classList.toggle('on', (s.u===0&&go===0&&cur===0) || (s.u>=1 && unitFirst[s.u]===go));
  });
  stage.querySelector('.slide.on').scrollTop=0;
}
prevB.onclick=function(){ show(cur-1); };
nextB.onclick=function(){ show(cur+1); };
document.addEventListener('keydown',function(e){
  // 스페이스 = 빈칸이 남아 있으면 하나 열고, 다 열었으면 다음 장
  if(e.key===' '){ e.preventDefault(); if(!(CLOZE && openNextBlank())) show(cur+1); return; }
  if(e.key==='ArrowRight'||e.key==='PageDown'){ e.preventDefault(); show(cur+1); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); show(cur-1); }
  else if(e.key==='Home'){ show(0); } else if(e.key==='End'){ show(SLIDES.length-1); }
  else if(e.key==='b'||e.key==='B'||e.key==='ㅠ'){ setCloze(!CLOZE); }
  else if(e.key==='q'||e.key==='Q'||e.key==='ㅂ'){ askBtn.click(); }
});
// 스와이프(모바일)
var tx=0;
stage.addEventListener('touchstart',function(e){ tx=e.touches[0].clientX; },{passive:true});
stage.addEventListener('touchend',function(e){
  var dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>60){ show(cur + (dx<0?1:-1)); }
},{passive:true});
// 전체화면
document.getElementById('fs').onclick=function(){
  if(!document.fullscreenElement){ (document.documentElement.requestFullscreen||function(){})(); }
  else if(document.exitFullscreen){ document.exitFullscreen(); }
};

show(0);
</script>
</body>
